name: Sync GitHub issues with MKGA Lab

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mkga-github-issue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync issues, post verified fixes and close resolved issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MKGA_RELEASE_SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: python3 tools/sync-mkga-github-issues.py
